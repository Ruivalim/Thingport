<!doctype html>
<!-- Chrome Web Store icon, 128x128 with a transparent background: the 96x96 icon centered with
     16px of padding, as the store's image guidelines ask. Rendered by `npm run store-assets`. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        width: 128px;
        height: 128px;
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      img {
        display: block;
        width: 96px;
        height: 96px;
        margin: 16px;
      }
    </style>
  </head>
  <body>
    <img src="../src/assets/thingport-icon-color.svg" alt="" />
  </body>
</html>
