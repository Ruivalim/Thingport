<!doctype html>
<!-- Small promotional tile, 440x280. Rendered by `npm run store-assets` (scripts/store-assets.ts). -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      html,
      body {
        width: 440px;
        height: 280px;
      }
      .grid {
        background-size: 28px 28px;
      }
      .copy {
        position: absolute;
        left: 32px;
        top: 30px;
        right: 32px;
      }
      .logo {
        height: 40px;
        display: block;
      }
      h1 {
        margin-top: 26px;
        font-size: 34px;
        line-height: 1.08;
      }
      .pills {
        position: absolute;
        left: 32px;
        bottom: 28px;
        gap: 8px;
      }
      .pill {
        font-size: 14px;
        padding: 5px 11px;
      }
      .pill.ghost {
        padding: 3px 9px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="copy">
      <img class="logo" src="../../frontend/src/assets/logos/thingport-lockup-compact-on-dark.svg" alt="" />
      <h1>Save <em>3D models</em><br />in one click</h1>
    </div>
    <div class="pills">
      <span class="pill">MakerWorld</span><span class="pill alt">Printables</span
      ><span class="pill ghost">Thingiverse</span>
    </div>
  </body>
</html>
