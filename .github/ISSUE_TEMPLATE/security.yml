name: Security improvement
description: Suggest hardening, or report a security issue that is already public or harmless to disclose
labels: [security]
body:
  - type: markdown
    attributes:
      value: |
        **Found a vulnerability someone could exploit?** Don't open a public issue. [Report it privately](https://github.com/TautvydasDerzinskas/Thingport/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What's the concern?
      description: The weakness or missing protection, and what could go wrong because of it.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Where?
      options:
        - Thingport (web app or API)
        - Thingport Grab (browser extension)
        - Thingport Bridge (desktop helper)
        - Docker images or deployment
        - Website or docs
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you suggest?
  - type: input
    id: version
    attributes:
      label: Version or image tag
      placeholder: "e.g. 1.4.0, sha-abc1234 or Grab 1.3.0"
  - type: checkboxes
    id: public
    attributes:
      label: Disclosure
      options:
        - label: This is safe to discuss publicly; it isn't an exploitable vulnerability in a released version.
          required: true
