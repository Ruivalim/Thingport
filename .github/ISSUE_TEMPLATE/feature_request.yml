name: Feature request
description: Suggest something for Thingport
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the part of your library workflow this would improve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
