name: Extension store release

# Versioned releases of Thingport Grab via semantic-release (extension/.releaserc.json): every
# Friday at 13:00 Polish time, or on demand. Only commits touching extension/ count; with a
# releasable one it bumps the version, writes the changelog, tags, creates a GitHub release with
# the store zips, and publishes to Edge Add-ons. Per-merge builds are in extension-release.yml.
on:
  workflow_dispatch: {}
  schedule:
    # GitHub cron is UTC-only; fire at both CET and CEST equivalents and let the Warsaw-time step
    # pick the right one.
    - cron: "0 11 * * 5"
    - cron: "0 12 * * 5"

concurrency:
  group: extension-store-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release commit, the tag and the GitHub release
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Friday 13:00 in Warsaw?
        id: gate
        if: github.event_name == 'schedule'
        run: |
          offset=$(TZ=Europe/Warsaw date +%z)
          case "${{ github.event.schedule }}|$offset" in
            "0 11 * * 5|+0200" | "0 12 * * 5|+0100") echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "This trigger isn't 13:00 in Warsaw (UTC offset $offset) -- the other one is. Skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run != 'false'
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run != 'false'
        with:
          node-version: 22 # semantic-release 25 needs Node 22.14+
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - if: steps.gate.outputs.run != 'false'
        run: npm ci
      - name: semantic-release
        id: release
        if: steps.gate.outputs.run != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
      # Not semantic-release's GitHub plugin: it marks releases "latest", a slot Bridge's links rely on.
      - name: GitHub release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" dist/zips/*.zip \
            --title "Thingport Grab ${{ steps.release.outputs.version }}" \
            --notes-file dist/release-notes.md \
            --latest=false
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.version != ''
        with:
          name: thingport-grab-store-zips
          path: extension/dist/zips/*.zip
          if-no-files-found: error

  # Its own job so it can be re-run alone: Edge takes one submission at a time and fails with
  # InProgressSubmission while the previous one is in certification. Credentials: see
  # extension/CONTRIBUTING.md.
  publish-edge:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    env:
      EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: thingport-grab-store-zips
          path: extension/dist/zips
      - name: Upload and submit for certification
        run: |
          npx tsx scripts/publish-edge.ts dist/zips/thingport-grab-edge.zip --notes \
            "Automated update to version ${{ needs.release.outputs.version }}. Changes: https://github.com/TautvydasDerzinskas/Thingport/releases/tag/${{ needs.release.outputs.tag }} -- testing instructions are unchanged from the previous submission; documentation: https://thingport.net/docs/grab/"
