name: Extension release

# Only runs when extension/ (the Thingport Grab browser extension) or this workflow changes.
# Unlike bridge-release.yml, this does NOT mark its release "latest" -- GitHub's "latest release"
# is one repo-wide slot, and Bridge's workflow already claims it (make_latest: true) for its own
# releases. Publishing here to a second, independently-tagged "latest" would clobber whichever one
# ran most recently, breaking the OTHER track's /releases/latest/download/<asset> links. Instead
# this always publishes to the same fixed tag, "extension-latest" -- deleting and recreating it
# each run -- and the Downloads page links to the tag-scoped path
# (.../releases/download/extension-latest/<asset>), never the /latest/ alias.
on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-release.yml"
  workflow_dispatch: {}

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-chrome:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Chrome and Edge get their own zips (identical code, see scripts/manifest.ts), each attached
      # to the release -- the in-app Download page links each browser to its own.
      - name: Build and package
        run: npm run zip:chrome && npm run zip:edge
      - uses: actions/upload-artifact@v4
        with:
          name: thingport-grab-chrome
          path: extension/dist/zips/thingport-grab-chrome.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: thingport-grab-edge
          path: extension/dist/zips/thingport-grab-edge.zip
          if-no-files-found: error

  build-firefox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Build (and the source archive AMO asks for alongside bundled code)
        run: npm run zip:firefox
      - name: Lint (validates the built manifest for both PRs and pushes, no AMO credentials needed)
        run: npx web-ext lint --source-dir dist/firefox
      # Signing only happens on a push to main (it needs the AMO_JWT_* secrets, which forked PRs
      # don't get, and there's nothing useful to attach to a PR run anyway).
      #
      # AMO rejects re-uploading a version number it has already seen for this add-on ID, even on
      # the unlisted channel -- and package.json's version isn't bumped on every commit. So this
      # signs the build with the run number appended as an extra version segment (e.g.
      # 1.1.0.456), guaranteeing a unique version on every run without touching the checked-in
      # version the Chrome build (or the repo) uses.
      - name: Patch a build-local version for signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jq --arg run "${{ github.run_number }}" '.version = "\(.version).\($run)"' \
            dist/firefox/manifest.json > manifest.json.tmp
          mv manifest.json.tmp dist/firefox/manifest.json
      - name: Sign (unlisted -- not published to addons.mozilla.org's public listing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/signed \
            --upload-source-code dist/zips/thingport-grab-sources.zip \
            --channel unlisted
      - name: Rename to a stable filename
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          xpi=$(ls dist/signed/*.xpi | head -n1)
          mv "$xpi" dist/signed/thingport-grab-firefox.xpi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: thingport-grab-firefox
          path: extension/dist/signed/thingport-grab-firefox.xpi
          if-no-files-found: error

  # Publishes to Microsoft Edge Add-ons (https://microsoftedge.microsoft.com/addons/detail/kahfidpmojfocohinlmglnfoaimocbol)
  # once per version: Edge rejects a version it already has, and package.json's version is only
  # bumped for real releases, not on every commit. Each version published here gets a
  # `extension-edge-v<version>` tag, which is what "already published" is checked against -- so
  # bumping the version in extension/package.json and merging to main is the whole release step.
  # A failed run (e.g. the previous version still in certification) leaves no tag, so the next
  # push or a manual re-run tries again. Skips itself until the credentials are set up (see
  # extension/CONTRIBUTING.md, "Publishing to Edge automatically").
  publish-edge:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [build-chrome]
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the extension-edge-v<version> tag
    defaults:
      run:
        working-directory: extension
    env:
      EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version still needs publishing
        id: check
        run: |
          version=$(jq -r .version package.json)
          tag="extension-edge-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$EDGE_PRODUCT_ID" ] || [ -z "$EDGE_CLIENT_ID" ] || [ -z "$EDGE_API_KEY" ]; then
            echo "::notice::Edge publishing isn't set up (EDGE_PRODUCT_ID variable, EDGE_CLIENT_ID and EDGE_API_KEY secrets) -- skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Version $version is already on Edge Add-ons ($tag exists) -- nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version isn't on Edge Add-ons yet -- publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - if: steps.check.outputs.publish == 'true'
        run: npm ci
      # The exact zip build-chrome built and attached to the release, not a rebuild.
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.publish == 'true'
        with:
          name: thingport-grab-edge
          path: extension/dist/zips
      - name: Upload and submit for certification
        if: steps.check.outputs.publish == 'true'
        run: |
          npx tsx scripts/publish-edge.ts dist/zips/thingport-grab-edge.zip --notes \
            "Automated update to version ${{ steps.check.outputs.version }} (commit ${{ github.sha }}). Testing instructions are unchanged from the previous submission; documentation: https://tautvydasderzinskas.github.io/Thingport/docs/grab/"
      - name: Tag the published version
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-chrome, build-firefox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: thingport-grab-chrome
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: thingport-grab-edge
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: thingport-grab-firefox
          path: dist
      - name: Move the extension-latest tag to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete extension-latest --yes --cleanup-tag || true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-latest
          name: Thingport Grab (latest)
          body: |
            Automated build of the Thingport Grab browser extension (see `extension/README.md`)
            from ${{ github.sha }}.

            See `extension/README.md` for install instructions:

            - **Edge**: install it from
              [Microsoft Edge Add-ons](https://microsoftedge.microsoft.com/addons/detail/kahfidpmojfocohinlmglnfoaimocbol),
              which keeps it up to date. `thingport-grab-edge.zip` here is the same build, for
              loading by hand (`edge://extensions` → **Developer mode** → **Load unpacked**).
            - **Chrome / other Chromium browsers**: unzip `thingport-grab-chrome.zip`, then
              `chrome://extensions` → enable **Developer mode** → **Load unpacked** → select the
              unzipped folder.
            - **Firefox**: download `thingport-grab-firefox.xpi` and open it directly (or drag it
              onto a Firefox window). It's signed by Mozilla for self-distribution, so it installs
              and updates like any other extension -- no Developer mode needed.
          files: |
            dist/thingport-grab-chrome.zip
            dist/thingport-grab-edge.zip
            dist/thingport-grab-firefox.xpi
