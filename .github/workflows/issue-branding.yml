name: Issue branding

# Issue forms can't put images in the submitted body, so add the logo once the issue exists.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const logo =
              'https://raw.githubusercontent.com/TautvydasDerzinskas/Thingport/main/frontend/src/assets/logos/thingport-lockup-stacked-color.svg';
            const body = context.payload.issue.body ?? '';
            if (body.includes(logo)) return;
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              body: `<p align="center"><img src="${logo}" alt="Thingport" width="160"></p>\n\n${body}`,
            });
